<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to PocketBox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1E293B;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: #EF4444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #94A3B8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
    }
    .status-dot.online {
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .tab-info {
      background: #1E293B;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .tab-title {
      font-weight: 600;
      color: #F1F5F9;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .tab-url {
      font-size: 11px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    select, input[type="text"] {
      width: 100%;
      background: #0B1120;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      color: #F8FAFC;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus {
      border-color: #EF4444;
    }
    .btn-save {
      width: 100%;
      padding: 10px;
      background: #EF4444;
      color: white;
      font-weight: 600;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.05s;
      margin-top: 4px;
    }
    .btn-save:hover {
      background: #DC2626;
    }
    .btn-save:active {
      transform: scale(0.98);
    }
    .btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .alert-box {
      display: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .alert-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #F87171;
    }
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1E293B;
      font-size: 11px;
    }
    .footer-link {
      color: #94A3B8;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 11px;
      padding: 0;
    }
    .footer-link:hover {
      color: #F8FAFC;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div class="brand-name">PocketBox</div>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div id="alertBox" class="alert-box"></div>

  <div class="tab-info">
    <div id="tabTitle" class="tab-title">Loading tab...</div>
    <div id="tabUrl" class="tab-url">...</div>
  </div>

  <form id="saveForm">
    <div class="form-group">
      <label for="folderSelect">Folder</label>
      <select id="folderSelect">
        <option value="">No Folder (General)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="tagsInput">Tags (comma separated)</label>
      <input type="text" id="tagsInput" placeholder="e.g. read-now, research">
    </div>

    <button type="submit" id="btnSave" class="btn-save">
      <span>💾 Save to PocketBox</span>
    </button>
  </form>

  <div class="footer-links">
    <button type="button" id="btnSyncQueue" class="footer-link">🔄 Sync Bookmark Queue</button>
    <a href="http://localhost:3000" target="_blank" class="footer-link">Open Library ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
