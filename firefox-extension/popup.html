<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to PocketBox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1E293B;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: #EF4444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #94A3B8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
    }
    .status-dot.online {
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .settings-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 13px;
      padding: 3px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .settings-btn:hover {
      color: #F8FAFC;
    }
    .settings-panel {
      background: #1E293B;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .settings-panel.hidden {
      display: none;
    }
    .tab-info {
      background: #1E293B;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .tab-info.newsletter {
      border-color: rgba(99, 102, 241, 0.5);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), #1E293B);
    }
    .source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .source-row.hidden {
      display: none;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.2);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    .link-hint {
      font-size: 10px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-title {
      font-weight: 600;
      color: #F1F5F9;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.35;
    }
    .tab-url {
      font-size: 11px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #F8FAFC;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus, input[type="password"]:focus {
      border-color: #EF4444;
    }
    .btn-save {
      width: 100%;
      padding: 10px;
      background-color: #EF4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, opacity 0.15s;
    }
    .btn-save:hover {
      background-color: #DC2626;
    }
    .btn-save.newsletter {
      background-color: #6366F1;
    }
    .btn-save.newsletter:hover {
      background-color: #4F46E5;
    }
    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      width: 100%;
      padding: 7px;
      background-color: #334155;
      color: #F8FAFC;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.15s;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    .alert-box {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 12px;
      display: none;
    }
    .alert-box.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
    }
    .alert-box.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #F87171;
    }
    .alert-box.warning {
      display: block;
      background-color: rgba(245, 158, 11, 0.15);
      border: 1px solid #F59E0B;
      color: #FCD34D;
    }
    .footer-links {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1E293B;
      font-size: 11px;
    }
    .footer-link {
      color: #94A3B8;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      font-family: inherit;
    }
    .footer-link:hover {
      color: #F8FAFC;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div class="brand-name">PocketBox</div>
    </div>
    <div class="header-actions">
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Checking...</span>
      </div>
      <button id="btnToggleSettings" class="settings-btn" title="Configura Server e API">⚙️</button>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="form-group">
      <label for="serverUrlInput">URL Server PocketBox</label>
      <input type="text" id="serverUrlInput" placeholder="http://localhost:3000 o https://...">
    </div>
    <div class="form-group">
      <label for="apiKeyInput">API Key o Password</label>
      <input type="password" id="apiKeyInput" placeholder="Inserisci se configurata">
    </div>
    <button type="button" id="btnSaveSettings" class="btn-secondary">Salva Impostazioni</button>
  </div>

  <div id="alertBox" class="alert-box"></div>

  <div id="tabInfo" class="tab-info">
    <div id="sourceRow" class="source-row hidden">
      <span id="sourceBadge" class="source-badge">📧 Newsletter Gmail</span>
      <span id="linkHint" class="link-hint"></span>
    </div>
    <div id="tabTitle" class="tab-title">Loading tab...</div>
    <div id="tabUrl" class="tab-url">...</div>
  </div>

  <form id="saveForm">
    <div class="form-group">
      <label for="folderSelect">Folder</label>
      <select id="folderSelect">
        <option value="">No Folder (General)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="tagsInput">Tags (comma separated)</label>
      <input type="text" id="tagsInput" placeholder="e.g. read-now, research">
    </div>

    <button type="submit" id="btnSave" class="btn-save">
      <span>💾 Save to PocketBox</span>
    </button>
  </form>

  <div class="footer-links">
    <a id="openLibraryLink" href="http://localhost:3000" target="_blank" class="footer-link">Open Library ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
